name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Zip Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath aria-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-windows-x64
          path: aria-windows-x64.zip
          retention-days: 90

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk aria-android-release.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-android-release-apk
          path: aria-android-release.apk
          retention-days: 90

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: aria-windows-x64
          path: artifacts

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: aria-android-release-apk
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Aria ${{ steps.tag.outputs.tag }}
          body: |
            # Aria ${{ steps.tag.outputs.tag }}

            ## Downloads
            - **Windows**: `aria-windows-x64.zip` — unzip and run `aria_companion.exe`
            - **Android**: `aria-android-release.apk` — sideload on your phone

            ## GPU Server
            Point the app at your AMD Radeon GPU server running llama-server:
            ```
            llama-server -m qwen2.5-7b-instruct-q4_k_m.gguf -ngl 99 --host 0.0.0.0 --port 8080
            ```
          files: |
            artifacts/aria-windows-x64.zip
            artifacts/aria-android-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
